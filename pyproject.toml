[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clarity-hauwm-minimal"
version = "0.2.0"
description = "Minimal horizon-sampling and ensemble-dynamics validation for CLARITY trajectories"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
mri = ["monai>=1.3", "nibabel>=5.0", "peft>=0.10", "torchvision>=0.16", "einops>=0.7"]

[project.scripts]
clarity-hauwm = "clarity_hauwm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

